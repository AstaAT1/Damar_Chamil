<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/app.css">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <!-- contact -->
    <section id="contact">
        <div class="container p-5">
            <div class="row">
                <div class="col-lg-6">
                    <div class="card mb-3 d-flex align-items-center justify-content-center" style="height:168px;">
                        <div class="geo_icons">
                            <i class="bi bi-geo-alt"></i>
                        </div>


                        <h3>Address</h3>
                        <p>A108 Adam Street, New York, NY 535022</p>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card mb-3 d-flex align-items-center justify-content-center text-center"
                        style="height:168px;">
                        <i class="bi bi-telephone"></i>

                        <h3>Call Us</h3>
                        <p>+1 5589 55488 55</p>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card mb-3 d-flex align-items-center justify-content-center text-center"
                        style="height:168px;">
                        <i class="bi bi-envelope"></i>
                        <h3>Email Us</h3>
                        <p>info@example.com</p>
                    </div>
                </div>
            </div>
            <!-- part2-->
            <div class="row g-4 mt-1">
                <div class="col-lg-6">
                    <div>
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d18906.129712753736!2d6.722624160288201!3d60.12672284414915!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x463e997b1b6fc09d%3A0x6ee05405ec78a692!2sJ%C4%99zyk%20trola!5e0!3m2!1spl!2spl!4v1672239918130!5m2!1spl!2spl"
                            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
            <!--  -->
            <div class="col-lg-6 inputtts">
                <form action="">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <input type="text" placeholder="Enter your text" required>
                        </div>
                        <div class="col-md-6">
                            <input type="email" placeholder="Enter your email" required>
                        </div>
                        <div class="col-md-12">
                            <input type="text" placeholder="Subject" required>
                        </div>
                         <div class="col-md-12">
                            <textarea placeholder="Message"></textarea>
                         </div>
                          <div class="col-md-12">
                            <button>Send Message</button>
                          </div>
                    </div>
                </form>
            </div>
        </div>
        </div>
    </section>

    <!-- bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
